name: Release

# A release is made by pushing a tag: v1.2.3 from main, or v1.2.3-beta.1 from
# beta. The version is written into the app at build time, so no file in the
# repository changes for a release and there is nothing to conflict on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

# Releases of one channel finish in order, so an older beta can't overwrite the
# manifest of a newer one.
concurrency:
  group: release-${{ contains(github.ref_name, '-beta.') && 'beta' || 'main' }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-node/package-lock.json

      - name: Read version
        id: version
        shell: pwsh
        run: |
          # Rejects anything that isn't v1.2.3 or v1.2.3-beta.1, and writes the
          # version into tauri.conf.json, package.json and Cargo.toml.
          $version = node scripts/stamp-version.mjs $env:TAG
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $isBeta = $version -match '-beta\.\d+$'
          # A beta tag must be on beta, and a full release on main, or a beta
          # would reach main users and an untested build would be Latest.
          $branch = if ($isBeta) { 'beta' } else { 'main' }
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$branch"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "$env:TAG must be tagged on a commit that is on the $branch branch."
            exit 1
          }
          # The update popup and the release show this entry, so stop before
          # building anything if it hasn't been written.
          node scripts/changelog.mjs manifest $version manifest-notes.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      # A release is never built from a commit that failed its checks. Quality
      # runs on every push to main and beta, so wait for the run on this commit.
      - name: Require Quality to have passed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(45)
          while ($true) {
            $runs = gh run list --workflow Quality --commit $env:GITHUB_SHA --event push --json status,conclusion | ConvertFrom-Json
            if ($runs | Where-Object { $_.conclusion -eq 'success' }) { break }
            if ($runs -and -not ($runs | Where-Object { $_.status -ne 'completed' })) {
              Write-Error "Quality failed on $env:GITHUB_SHA, so $env:TAG can't be released."
              exit 1
            }
            if ((Get-Date) -gt $deadline) {
              Write-Error "Quality did not finish for $env:GITHUB_SHA in time."
              exit 1
            }
            Start-Sleep -Seconds 30
          }

      - name: Check whether this version was already released
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view` exits 1 when the release is absent, which is the
          # normal case. Swallow it so the step itself still succeeds.
          gh release view "${{ steps.version.outputs.tag }}" 2>&1 | Out-Null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          if ($exists -eq 'true') {
            Write-Host "::notice::${{ steps.version.outputs.tag }} already exists, skipping release."
          }
          exit 0

      # Keep release installs consistent with Quality: security overrides can
      # change the resolved dependency tree, so refresh both lockfiles before
      # npm ci rather than failing on a stale committed lockfile.
      - name: Refresh frontend lockfile
        if: steps.existing.outputs.exists == 'false'
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frontend dependencies
        if: steps.existing.outputs.exists == 'false'
        run: npm ci

      - name: Refresh backend lockfile
        if: steps.existing.outputs.exists == 'false'
        run: npm install --package-lock-only --ignore-scripts
        working-directory: src-node

      - name: Install backend dependencies
        # better-sqlite3 ships prebuilt binaries, but npm auto-runs `node-gyp
        # rebuild` because binding.gyp is present, which fails on the runner's
        # Visual Studio version. Skipping scripts uses the shipped prebuild.
        if: steps.existing.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: src-node

      # Done here rather than at runtime: an app deleting native binaries from
      # its own install folder on launch is itself an antivirus heuristic.
      - name: Remove native addons for other platforms
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        working-directory: src-node/node_modules/better-sqlite3/prebuilds
        run: |
          if (-not (Test-Path win32-x64.node)) {
            Write-Error "win32-x64.node is missing, so the backend would not start."
            exit 1
          }
          Get-ChildItem -Filter *.node | Where-Object Name -ne 'win32-x64.node' | Remove-Item

      - name: Cache cargo
        if: steps.existing.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build installer
        if: steps.existing.outputs.exists == 'false'
        # Signing is what makes the build installable as an update: the app
        # verifies this signature against the public key in tauri.conf.json
        # and refuses anything that does not match.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Build update manifest
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/TimeLogger_${{ steps.version.outputs.version }}_x64-setup.exe"
          $signature = "$installer.sig"
          if (-not (Test-Path $signature)) {
            Write-Error "No signature at $signature - is TAURI_SIGNING_PRIVATE_KEY set on the repository?"
            exit 1
          }
          $signatureContent = (Get-Content $signature -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signatureContent)) {
            Write-Error "Signature file is empty: $signature"
            exit 1
          }
          # Installed apps read this from the 'latest' release, or the beta-manifest
          # branch for betas, so the download URL must point at the tag rather than at
          # 'latest' - otherwise an older client would follow it to a newer build
          # than it was told about.
          $manifest = [ordered]@{
            version   = "${{ steps.version.outputs.version }}"
            notes     = (Get-Content manifest-notes.txt -Raw)
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signatureContent
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/TimeLogger_${{ steps.version.outputs.version }}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/TimeLogger_${{ steps.version.outputs.version }}_x64-setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName
            exit 1
          }
          # GitHub's 'latest' release skips pre-releases, which keeps betas away
          # from the main channel.
          $channelArgs = if ('${{ steps.version.outputs.branch }}' -eq 'beta') { @('--prerelease', '--latest=false') } else { @() }
          node scripts/changelog.mjs release "${{ steps.version.outputs.version }}" release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The changelog goes first, above GitHub's generated list of pull requests.
          gh release create "${{ steps.version.outputs.tag }}" $installer "$installer.sig" latest.json `
            --title "TimeLogger ${{ steps.version.outputs.tag }}" `
            --notes-file release-notes.md `
            --generate-notes `
            @channelArgs
          if ($LASTEXITCODE -ne 0) {
            # Another release run may have published this tag after our earlier
            # existence check. Treat that race as success, but preserve real errors.
            gh release view "${{ steps.version.outputs.tag }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::notice::${{ steps.version.outputs.tag }} was published by another run; skipping duplicate publication."
              exit 0
            }
            exit 1
          }

      # GitHub has no URL for the latest pre-release and this repository's
      # releases are immutable, so beta users read the manifest from the
      # beta-manifest branch, which each beta updates.
      - name: Publish beta manifest
        if: steps.existing.outputs.exists == 'false' && steps.version.outputs.branch == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $path = "repos/${{ github.repository }}/contents/latest.json"
          $sha = gh api "${path}?ref=beta-manifest" --jq .sha
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/latest.json"))
          gh api -X PUT $path --silent `
            -f branch=beta-manifest `
            -f "message=Update the beta manifest to ${{ steps.version.outputs.tag }}" `
            -f "content=$content" `
            -f "sha=$sha"
          exit $LASTEXITCODE
