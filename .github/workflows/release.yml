name: Release

# Runs only after Quality succeeds on main, so a release is never published
# from a commit that failed its checks.
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-node/package-lock.json

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether this version was already released
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view` exits 1 when the tag is absent, which is the
          # normal case. Swallow it so the step itself still succeeds.
          gh release view "${{ steps.version.outputs.tag }}" 2>&1 | Out-Null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          if ($exists -eq 'true') {
            Write-Host "::notice::${{ steps.version.outputs.tag }} already exists, skipping release."
          }
          exit 0

      - name: Install frontend dependencies
        if: steps.existing.outputs.exists == 'false'
        run: npm ci

      - name: Install backend dependencies
        # better-sqlite3 ships prebuilt binaries, but npm auto-runs `node-gyp
        # rebuild` because binding.gyp is present, which fails on the runner's
        # Visual Studio version. Skipping scripts uses the shipped prebuild.
        if: steps.existing.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: src-node

      - name: Cache cargo
        if: steps.existing.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build installer
        if: steps.existing.outputs.exists == 'false'
        # Signing is what makes the build installable as an update: the app
        # verifies this signature against the public key in tauri.conf.json
        # and refuses anything that does not match.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Build update manifest
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/TimeLogger_${{ steps.version.outputs.version }}_x64-setup.exe"
          $signature = "$installer.sig"
          if (-not (Test-Path $signature)) {
            Write-Error "No signature at $signature - is TAURI_SIGNING_PRIVATE_KEY set on the repository?"
            exit 1
          }
          # Installed apps read this from the 'latest' release, so the download
          # URL must point at the tag rather than at 'latest' - otherwise an
          # older client would follow it to a newer build than it was told about.
          $manifest = [ordered]@{
            version   = "${{ steps.version.outputs.version }}"
            notes     = "See https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signature -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/TimeLogger_${{ steps.version.outputs.version }}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/TimeLogger_${{ steps.version.outputs.version }}_x64-setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName
            exit 1
          }
          gh release create "${{ steps.version.outputs.tag }}" $installer "$installer.sig" latest.json `
            --title "TimeLogger ${{ steps.version.outputs.tag }}" `
            --generate-notes `
            --target "${{ github.event.workflow_run.head_sha }}"
