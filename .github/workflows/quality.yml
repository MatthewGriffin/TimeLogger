name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-node/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        # better-sqlite3 ships prebuilt binaries, but npm auto-runs `node-gyp
        # rebuild` because binding.gyp is present, which fails on the runner's
        # Visual Studio version. Skipping scripts uses the shipped prebuild.
        run: npm ci --ignore-scripts
        working-directory: src-node
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm run check
