name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      # Keep CI tests away from any user profile data, including on self-hosted runners.
      TIMELOGGER_DATA_DIR: ${{ github.workspace }}/.timelogger-test-data
      # The complete UI suite visits many routes; keep production throttling unchanged.
      TIMELOGGER_API_RATE_LIMIT: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-node/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        # better-sqlite3 ships prebuilt binaries, but npm auto-runs `node-gyp
        # rebuild` because binding.gyp is present, which fails on the runner's
        # Visual Studio version. Skipping scripts uses the shipped prebuild.
        run: npm ci --ignore-scripts
        working-directory: src-node
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: src-node
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - run: npm run check
      - name: Install Playwright browser
        # Chromium only: the app ships on WebView2, so the other engines would
        # not tell us anything about what users actually run.
        run: npx playwright install chromium
      - name: Run end-to-end tests with isolated backend
        shell: pwsh
        run: |
          $backendLog = Join-Path $env:RUNNER_TEMP 'timelogger-backend.log'
          $backendErrorLog = Join-Path $env:RUNNER_TEMP 'timelogger-backend-error.log'
          $backend = Start-Process -FilePath node -ArgumentList 'server.js' -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE 'src-node') -PassThru -RedirectStandardOutput $backendLog -RedirectStandardError $backendErrorLog
          $exitCode = 0
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-RestMethod -Uri 'http://127.0.0.1:3001/health' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              if (Test-Path $backendLog) { Get-Content $backendLog }
              if (Test-Path $backendErrorLog) { Get-Content $backendErrorLog }
              throw 'Node sidecar did not become healthy within 30 seconds.'
            }

            npm run test:e2e
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              if (Test-Path $backendLog) { Get-Content $backendLog }
              if (Test-Path $backendErrorLog) { Get-Content $backendErrorLog }
            }
          } finally {
            if ($backend -and -not $backend.HasExited) {
              Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
            }
          }
          exit $exitCode
      - name: Clean isolated backend data
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force $env:TIMELOGGER_DATA_DIR -ErrorAction SilentlyContinue
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/results
            test-results
          retention-days: 7
