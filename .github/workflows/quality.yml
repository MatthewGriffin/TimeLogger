name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-node/package-lock.json
      - name: Refresh frontend lockfile for security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install frontend dependencies
        run: npm ci
      - name: Refresh backend lockfile for security overrides
        run: npm install --package-lock-only --ignore-scripts
        working-directory: src-node
      - name: Install backend dependencies
        # better-sqlite3 ships prebuilt binaries, but npm auto-runs `node-gyp
        # rebuild` because binding.gyp is present, which fails on the runner's
        # Visual Studio version. Skipping scripts uses the shipped prebuild.
        run: npm ci --ignore-scripts
        working-directory: src-node
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: src-node
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve and compile Rust dependencies
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Commit regenerated Cargo.lock to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "chore: update Rust dependency lockfile"
            git push origin "HEAD:$PR_HEAD_REF"
          fi
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - run: npm run check