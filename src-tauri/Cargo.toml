[package]
name = "app"
version = "0.9.0-beta.2"
description = "Tempo time logging helper app"
authors = ["Matthew Griffin"]
license = "MIT"
repository = "https://github.com/MatthewGriffin/TimeLogger"
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "webview-data-url"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
semver = "1"
url = "2"
urlencoding = "2"
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.8.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
