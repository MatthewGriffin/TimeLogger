[package]
name = "app"
version = "0.5.1"
description = "Tempo time logging helper app"
authors = ["Matthew Griffin"]
license = "MIT"
repository = "https://github.com/MatthewGriffin/TimeLogger"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "webview-data-url"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tauri-plugin-shell = "2.0.0"
url = "2"
urlencoding = "2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.3"
